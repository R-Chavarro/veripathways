<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Academic Pathways</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            font-size: 4rem;
            color: #1e3a8a;
            margin-bottom: 1rem;
        }

        h2 {
            margin-bottom: 1rem;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background .2s ease;
        }

        a:hover {
            background: #16316d;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        The page you're looking for doesn't exist or may have been moved.
    </p>

    <a href="/">Return to Home</a>

</div>

</body>
</html>
